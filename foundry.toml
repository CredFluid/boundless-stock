[profile.default]
src = "src"
out = "out"
libs = ["node_modules"]
test = "test"
script = "script"
solc = "0.8.22"
optimizer = true
optimizer_runs = 200
via_ir = false
evm_version = "paris"
fs_permissions = [
  { access = "read", path = "./out" },
  { access = "read", path = "./node_modules" },
  { access = "read-write", path = "./deployments" },
  { access = "read", path = "./config" }
]

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = true
