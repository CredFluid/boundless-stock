[profile.default]
src = "src"
out = "out"
libs = ["node_modules", "lib"]
test = "test"
script = "script"
solc = "0.8.22"
optimizer = true
optimizer_runs = 200
via_ir = false
evm_version = "paris"
fs_permissions = [
  { access = "read", path = "./out" },
  { access = "read", path = "./node_modules" },
  { access = "read-write", path = "./deployments" },
  { access = "read", path = "./config" }
]

[invariant]
runs = 64
depth = 64
fail_on_revert = false
call_override = false
shrink_run_limit = 2000

[fuzz]
runs = 512

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = true
